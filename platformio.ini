; ============================================================
;  Dock Station — ESP-WROOM-32
; ============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200

; ── USB upload (first flash) ─────────────────────────────────
; Default: serial upload via USB


; ── Libraries ────────────────────────────────────────────────
lib_deps =
    knolleary/PubSubClient          @ ^2.8
    bblanchon/ArduinoJson           @ ^7.0
    milesburton/DallasTemperature   @ ^3.11
    paulstoffregen/OneWire          @ ^2.3
    adafruit/DHT sensor library     @ ^1.4
    adafruit/Adafruit Unified Sensor @ ^1.1

build_flags =
    -DCORE_DEBUG_LEVEL=0
